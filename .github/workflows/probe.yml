name: ESPN probe

# 手動執行：查 ESPN 某聯賽某天的賽程（沙盒連不到 ESPN 時用）
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "path:dates，逗號分隔，例如 soccer/jpn.1:20261128"
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/probe.js "${{ inputs.targets }}"
