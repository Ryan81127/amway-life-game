      </div>
      <ol class="steps">
        <li><span>01</span><b>說出需求</b><p>在廣場輸入「漏水」「報稅」，相關廠商會跑過來找你。</p></li>
        <li><span>02</span><b>請我介紹</b><p>看完介紹，按「請幫我介紹」留下你的需求。</p></li>
        <li><span>03</span><b>確認後牽線</b><p>沒有合適的廠商？留下需求，我幫你去找。</p></li>
      </ol>
