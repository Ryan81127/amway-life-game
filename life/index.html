<script>
/* ======================= 設定 ======================= */
const CFG={distributor:"Ryan",lineUrl:"https://line.me/ti/p/l2KcblqQbI"};
const KEY="amway-life-game-v3";
const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,G.fast?5:ms));
const DEF={name:"",egg:"",done:{},badges:[],cards:[],plays:0,coins:0,owned:[],outfit:"cape",custom:false};
let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S=Object.assign({},DEF)}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ======================= 聲音（Web Audio 自製，點擊後才播放） ======================= */
const AU=(()=>{let ctx=null,master=null,noiseBuf=null,muted=false,mode="town",step=0,nextT=0,timer=null,started=false;
 try{muted=localStorage.getItem(KEY+"-mute")==="1"}catch(e){}
 const F=n=>440*Math.pow(2,(n-69)/12);
 const SONG={
  town:{bpm:112,chords:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],
   mel:[72,76,79,76,77,76,74,72, 72,0,76,72,69,72,76,0, 77,0,81,79,77,76,74,72, 74,76,79,0,79,77,76,74,
        72,76,79,84,83,79,76,79, 81,0,79,76,72,76,79,0, 77,81,84,81,79,77,76,77, 79,0,74,0,71,74,79,0]},
  battle:{bpm:136,chords:[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],
   mel:[81,79,76,79,81,0,84,81, 77,76,77,81,79,0,77,76, 76,79,84,79,76,79,83,84, 83,0,79,0,74,76,79,83,
        84,0,81,0,76,79,81,84, 81,79,77,0,77,81,84,0, 79,76,72,76,79,84,88,84, 86,0,83,0,79,83,86,0]}};
 function init(){if(ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
  try{ctx=new AC({latencyHint:"interactive"})}catch(e){ctx=new AC()}
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
  master=ctx.createGain();master.gain.value=muted?0:1;master.connect(comp);comp.connect(ctx.destination);
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  document.addEventListener("visibilitychange",()=>{if(!ctx)return;document.hidden?ctx.suspend():ctx.resume()});return true}
 function tone(t,f,dur,type,vol,att=.006){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}
 function noise(t,dur,vol,freq,type="highpass"){const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noiseBuf;f.type=type;f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.02)}
 function playStep(t){const sg=SONG[mode],e=60/sg.bpm/2,i=step%64,bar=Math.floor((i%32)/8),ch=sg.chords[bar],m=sg.mel[i];
  if(m){tone(t,F(m),e*1.6,"triangle",.30);tone(t,F(m),e*1.1,"square",.045);if(mode==="town")tone(t+.004,F(m+12),e*.8,"sine",.05)}
  const arp=[0,2,1,2][i%4];tone(t,F(ch[arp]+12),e*1.5,"triangle",.11);
  if(i%8===0||i%8===4){tone(t,F(ch[0]-12),e*2.6,"square",.06);tone(t,F(ch[0]),e*2.4,"triangle",.10)}
  if(i%2===0)noise(t,.035,.07,7000);
  if(i%8===2||i%8===6)noise(t,.12,.16,1800,"bandpass");
  if(mode==="battle"&&i%2===1)noise(t,.025,.05,9000);
  if(i%8===0){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(55,t+.12);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(master);o.start(t);o.stop(t+.2)}
  step++;nextT+=e}
 function sched(){if(!ctx||ctx.state!=="running")return;if(nextT<ctx.currentTime)nextT=ctx.currentTime+.02;while(nextT<ctx.currentTime+.15)playStep(nextT)}
 function start(){if(!init())return;try{const r=ctx.resume();r&&r.catch&&r.catch(()=>{})}catch(e){}
  try{const b=ctx.createBufferSource();b.buffer=ctx.createBuffer(1,1,22050);b.connect(ctx.destination);b.start(0)}catch(e){}
  if(started)return;started=true;const t=ctx.currentTime+.02;
  [84,88,91,96].forEach((n,k)=>{tone(t+k*.07,F(n),.5,"triangle",.32);tone(t+k*.07,F(n),.25,"square",.05)});
  nextT=t+.32;sched();timer=setInterval(sched,25)}
 function setMode(m){if(m===mode)return;mode=m;step=0}
 function sfx(n){if(!ctx||muted)return;const t=ctx.currentTime+.01;
  if(n==="click")tone(t,F(88),.09,"triangle",.2);
  if(n==="ok")[76,80,83,88].forEach((x,k)=>tone(t+k*.06,F(x+4),.25,"triangle",.3));
  if(n==="no"){tone(t,F(67),.22,"triangle",.28);tone(t+.16,F(63),.32,"triangle",.28)}
  if(n==="crack"){noise(t,.08,.4,2500,"bandpass");noise(t+.1,.08,.35,3000,"bandpass");[79,84,88].forEach((x,k)=>tone(t+.18+k*.06,F(x),.3,"triangle",.28))}
  if(n==="fan")[72,76,79,84,79,84,88].forEach((x,k)=>{tone(t+k*.11,F(x),.35,"triangle",.32);tone(t+k*.11,F(x),.2,"square",.05)})}
 function paint(){const b=$("#mute");b.textContent=muted?"🔇":"🔊";b.setAttribute("aria-label",muted?"聲音已關閉，點一下開啟":"聲音已開啟，點一下關閉")}

 else{AU.sfx("no");mon.classList.remove("in");mon.classList.add("smug");$("#hero").innerHTML=heroHTML("scared");ar.insertAdjacentHTML("beforeend",`<div class="fly r">差一點！</div>`)}

  $("#nx").onclick=next},G.fast?5:650)}
function next(){if(R.trap)return renderTrapResult();

 if(R.correct>=2){$("#mon").innerHTML=cloudSVG("down");return renderPassGate()}
 renderFail()}

 for(const id of["a1","a2","a3","a4"]){await wait(550);const el=$("#"+id);if(el){el.classList.add("on");AU.sfx("click")}}
 await wait(400);AU.sfx("fan");

 <p style="font-weight:800;margin:0;font-size:15px">★ 過關　★ 3 道抉擇全對　★ 識破陷阱題</p><p style="font-weight:900;margin:4px 0 0">🌱 ${esc(S.name)} 成為「新手勇者」！</p>`;

  const n=CG.gain,t0=performance.now(),dur=G.fast?10:900;await new Promise(res=>{const f=()=>{const k=Math.min(1,(performance.now()-t0)/dur),el=$("#cgain");if(el)el.textContent=Math.round(n*k);if(k<1)requestAnimationFrame(f);else res()};f()});refreshCoins()}

async function shareCard(){let av=S.custom?await avatarImage():null;try{drawShare(av)}catch(e){drawShare(null)}}
function drawShare(av){const c=document.createElement("canvas");c.width=600;c.height=800;const x=c.getContext("2d");
 const g=x.createLinearGradient(0,0,0,800);g.addColorStop(0,"#d8ece6");g.addColorStop(1,"#f3e2b8");x.fillStyle=g;x.fillRect(0,0,600,800);
 x.strokeStyle="#a8743f";x.lineWidth=10;x.strokeRect(20,20,560,760);const t=(s,y,sz,col="#4a3320")=>{x.fillStyle=col;x.font=`900 ${sz}px "PingFang TC","Noto Sans TC","Noto Sans CJK TC",sans-serif`;x.textAlign="center";x.fillText(s,300,y)};
 const d=S.done[1]||{stars:0};t("人生升級：安麗冒險",110,44);t("第 1 關 起點村 通關！",180,34,"#6e4320");if(av){x.drawImage(av,210,220,180,240)}else t("🌱",330,120);t(`${S.name}｜新手勇者`,500,38);t("★".repeat(d.stars)+"☆".repeat(3-d.stars),570,56,"#e0a623");
 t(`夥伴：${EGGS[S.egg||"friend"].n}`,630,30);t("直銷商個人製作，非安麗官方網站",740,22,"#7a5232");
 c.toBlob(b=>{if(!b){if(av)drawShare(null);return}const u=URL.createObjectURL(b);$("#sc").innerHTML=`<img src="${u}" alt="成績卡" style="width:100%;border-radius:12px;margin-top:10px;border:3px solid #a8743f"><a class="btn g" download="amway-v3-level1.png" href="${u}">下載成績卡</a>`;
